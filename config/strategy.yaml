# Market-structure settings for the XAUUSD strategy (Strategy Spec v1).
# Every distance is in ATR units so the same rules can later run on forex.
atr_period: 14

swings:                 # fractal length L per timeframe (confirmed L candles later)
  M5: 2
  M15: 3
  H1: 3
  H4: 3

structure:
  ranging_lookback: 10  # two opposite breaks within this many candles = ranging

displacement:
  min_body_atr: 1.2     # body >= 1.2 x ATR(14, M5)
  min_body_ratio: 0.6   # body >= 60% of the candle range

fvg:
  min_size_atr: 0.25
  min_size_spreads: 3.0

liquidity:
  sweep_max_depth_atr: 1.5   # wick beyond the pool by at most 1.5 x ATR(14, M5)
  sweep_reclaim_candles: 3   # close back inside on the sweep candle or the next 2
  sweep_valid_candles: 12    # CHoCH must follow within 12 M5 candles
  equal_level_atr_m15: 0.1   # equal highs/lows: swings within 0.1 x ATR(14, M15)
  swing_pool_lookback_days: 5

sessions:               # New York local time, [start, end)
  asia: ["20:00", "24:00"]
  london_kz: ["02:00", "05:00"]
  newyork_kz: ["07:00", "10:00"]
  london_close: ["10:00", "12:00"]
  rollover: ["16:55", "18:05"]
  kill_zone_grace_minutes: 30
  friday_cutoff: "10:00"     # no new signals on Friday after this NY time
  trading_day_start: "17:00" # NY close

volatility:
  median_days: 20
  dead_ratio: 0.6
  chaos_ratio: 2.5
  max_spread_ratio: 1.5
  min_stop_spreads: 5.0

# Which strategy sends signals:
#   london   = London breakout of the Asian range with the H4 trend filter (owner 2026-11-27; the only
#              strategy that held up in research: EXP-015/016/020, RESEARCH REQUIRED -> paper signals)
#   regime   = pick by market: bullish -> buy the dip, bearish -> sell the rally, neutral -> fade the range
#   v1       = the original sweep + reversal model (Strategy Spec v1) in every market
#   bullish / bearish / sideways = one mode only, in every market (for comparison)
mode: london

# London breakout (mode: london). These are the TESTED rules (EXP-016 original + EXP-020 natural stop).
# Changing any value makes it an untested strategy; signals and reports then say so.
london:
  range_start_ny: "20:00"    # Asian range, New York time (evening before)
  range_end_ny: "01:00"      # setup is sent when this candle closes
  close_ny: "16:00"          # close anything still open (New York time)
  buffer_pct: 0.02           # stop orders this % of price beyond the range
  target_r: 3.0
  breakeven_r: 1.0           # stop to entry after +1R
  trend_filter: true         # only the H4 trend side; neutral H4 = both sides, first breakout wins
  stop_cap_pct: null         # null = natural stop (other side of the range), never tightened
  min_range_candles: 50

modes:
  ema_fast: 20               # M15 EMAs used by the bullish mode
  ema_slow: 50
  bullish:                   # buy the dip in an uptrend
    pullback_window: 36      # M5 candles back to find the pullback low
    min_pullback_atr: 1.0    # pullback depth from the prior high (M5 ATR)
    ema_touch_atr: 0.25      # pullback low within this x M15 ATR of EMA20 counts as "at the EMA"
    tp2_r: 2.0               # measured move if no liquidity target is far enough
    tp3_r: 3.0               # runner
    time_stop_candles: 36    # 3 hours
  bearish:                   # sell the corrective rally in a downtrend
    rally_window: 24         # M5 candles back to find the buy-stop raid
    tp2_min_r: 2.0           # TP2 must be real sell-side liquidity this far away
    time_stop_candles: 18    # 90 minutes
  sideways:                  # fade false breakouts of the H1 range
    min_range_atr_h1: 2.0    # range width limits (H1 ATR)
    max_range_atr_h1: 8.0
    max_vol_ratio: 1.3       # skip when M5 ATR is expanding vs its usual level
    edge_zone: 0.15          # sweep must be within 15% of the range from its edge
    min_wick: 0.4            # rejection wick (share of the sweep candle) if not closed back on the same candle
    opposite_edge_buffer: 0.1
    tp2_min_r: 1.5           # GUESS: range targets are capped by the opposite edge
    time_stop_candles: 18

news:                        # Strategy Spec v1, "News and volatility filters"
  enabled: true
  currencies: [USD]          # XAUUSD reacts to USD news
  calendar_file: data/news/calendar.csv     # cached calendar (also used by the backtest if it covers the period)
  feed_url: https://nfs.faireconomy.media/ff_calendar_thisweek.json   # free weekly calendar (ForexFactory export)
  refresh_minutes: 60
  tier1_keywords: [Non-Farm, NFP, CPI, FOMC, Federal Funds Rate, Fed Chair, Interest Rate Decision]
  tier1_before_min: 60       # NFP, CPI, FOMC, rate decisions
  tier1_after_min: 30
  fomc_after_min: 90         # GUESS: covers the press conference
  high_before_min: 30        # other high-impact (red) events
  high_after_min: 15
  block_holidays: true       # US bank holidays block the whole New York day
  alert_before_min: 10       # warn open signals this long before a blocking event

entry:                       # Strategy Spec v1, "Entry, stop loss and take profit"
  min_score: 65              # A grade and above are sent
  a_plus_score: 80
  b_grade_score: 50          # 50-64 = grade B: logged, never sent
  sl_buffer_atr: 0.1         # buffer = max(0.1 x ATR(14, M5), 2 x spread)
  sl_buffer_spreads: 2.0
  min_stop_atr: 0.5
  max_stop_atr: 2.5
  tp1_min_r: 1.0
  tp2_min_r: 2.0
  tp3_min_r: 3.0
  expiry_candles: 6          # limit order lifetime (30 min)
  time_stop_candles: 24      # close at market if no TP1 / SL within 2 hours of the fill
  session_close_hours: 2     # close anything still open 2h after its kill zone ends
  preferred_kill_zone: newyork_kz   # session-fit points for XAUUSD

backtest:
  assumed_spread_points: 30  # used when the data has no spread (0.30 USD on XAUUSD)
  risk_pct: 0.5
  daily_loss_lock_pct: 2.0
  weekly_loss_lock_pct: 5.0
  max_losses_in_row: 2       # per day
  max_signals_per_session: 2
  # Market regime label for the report (H4): bullish/bearish when the close is on that side
  # of EMA(period) and the EMA moved >= min_slope_atr x ATR(14) over slope_bars; else neutral.
  regime_ema_period: 50
  regime_slope_bars: 10
  regime_min_slope_atr: 0.5   # GUESS

# Pattern mining: python -m quant_engine patterns (or find_patterns.bat).
# Looks for repeatable moves per H4 market (bullish / bearish / neutral) on the OLDER part of the
# history, then checks each one on the NEWER part it never saw. Distances are M5 ATR(14).
research:
  discover_frac: 0.6         # older 60% = discovery, newer 40% = held-out check
  sl_atr: [1.0]              # stop distance tested
  tp_atr: [1.0, 2.0]         # target distances tested
  horizons: [12, 36]         # give up after 1 h / 3 h (M5 candles)
  sweep_lookbacks: [24, 72]  # liquidity sweep of the last 2 h / 6 h high or low
  impulse_body_atr: 1.5      # impulse candle: body >= 1.5 ATR ...
  impulse_body_ratio: 0.6    # ... and >= 60% of the candle
  move_bars: 12              # big move: >= 3 ATR in 1 hour
  move_atr: 3.0
  range_bars: 48             # range edge: last 4 h range, 3-10 ATR wide, touch within 10% of an edge
  range_min_atr: 3.0
  range_max_atr: 10.0
  range_edge: 0.1
  min_trades_discover: 30    # fewer trades than this = not tested
  min_trades_validate: 15
  fdr_q: 0.10                # false discovery rate for the many patterns tested (Benjamini-Hochberg)
  min_avg_r: 0.05            # must beat costs by at least 0.05 R per trade
  min_stable_thirds: 2       # positive in at least 2 of the 3 thirds of the discovery period
  validate_p: 0.05           # held-out check (Bonferroni-corrected over the patterns found)
  max_patterns: 20
  use_verdicts: [confirmed]  # which patterns `mode: patterns` may signal from
  patterns_file: reports/patterns_latest.json
  fixed_spread_points: 20    # one realistic spread (0.20 USD) for every year; broker spreads were 40 pts in 2015, ~5 in 2021
  round_steps: [50, 100]     # round-number levels: 4000, 4050, 4100 ...
  level_days: [5, 20]        # major support / resistance: the 5-day and 20-day high and low
  pin_wick_ratio: 0.6        # price action: pin bar = rejection wick >= 60% of the candle ...
  pin_min_atr: 1.0           # ... and candle range >= 1 ATR
  level_touch_atr: 0.25      # "at a level" = within 0.25 ATR of it
  news_times_ny: ["08:30", "10:00", "14:00"]   # US data / FOMC release times (New York clock)
  news_spike_atr: 2.5        # news shock: the release candle is >= 2.5 ATR long
  timeframes:                # swing versions: python -m quant_engine patterns --timeframe H1 (or H4)
    H1:                      # counts are H1 candles; ATR = ATR(14) on H1
      tp_atr: [1.0, 2.0, 3.0]
      horizons: [8, 24]      # hold up to 8 h / 1 day
      sweep_lookbacks: [24, 72]   # last 1 day / 3 days
      move_bars: 6
      range_bars: 24
    H4:                      # counts are H4 candles; ATR = ATR(14) on H4
      tp_atr: [1.0, 2.0, 3.0]
      horizons: [6, 18]      # hold up to 1 day / 3 days
      sweep_lookbacks: [6, 30]    # last 1 day / 5 days
      move_bars: 3
      range_bars: 12
  costs:                     # charged in every research backtest (rulebook rule 6)
    min_spread_points: 8       # floor under the historical bar spread ($0.08, owner's broker)
    commission_per_lot: 0      # USD per lot round trip (owner confirmed 0 on 2026-11-26)
    contract_size: 100         # 1 lot = 100 oz
    slippage_points: 2         # per side on market / stop fills ($0.02). GUESS
  regime4:                   # bullish / bearish / sideways / uncertain on H4 (rulebook rule 4)
    ema_period: 50
    slope_bars: 10
    trend_slope_atr: 0.5       # GUESS
    confirm_bars: 2
    flat_slope_atr: 0.2        # GUESS
    range_bars: 30
    range_max_atr: 8.0         # GUESS
  bigmoves:                  # python -m quant_engine bigmoves (30-50 pip moves within 30 minutes)
    pip_usd: 0.10            # gold: 1 pip = $0.10, so 30 pips = $3
    move_pips: [30, 50]
    window_bars: 6           # 6 M5 candles = 30 minutes
    target_pips: [30, 50]
    stop_pips: [20, 30, 50]
