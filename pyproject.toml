[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xauusd-quant-engine"
version = "0.1.0"
description = "XAUUSD intraday signal engine (signals only, no order execution)"
requires-python = ">=3.10"

[project.scripts]
quant-engine = "quant_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
