<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>XAUUSD Quant Engine</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23e9b949'/%3E%3Cpath d='M7 21l6-7 5 4 7-9' stroke='%23201606' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="/static/css/glass.css">
  <script src="/vendor/plotly.min.js" defer></script>
</head>
<body>
  <div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
  <div class="shell">
    <aside class="sidebar glass">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 32 32"><path d="M7 21l6-7 5 4 7-9"/></svg></div>
        <div><div class="brand-name">Quant Engine</div><div class="brand-sub">XAUUSD · signals only</div></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot">
        <div class="safe-pill"><span class="dot good"></span>No order execution</div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Market</h1>
          <div id="page-sub" class="muted small"></div>
        </div>
        <div class="top-actions">
          <button id="live-btn" class="chip" title="Fetch the newest candles from MT5 on a timer">
            <span class="dot"></span><span>Live off</span>
          </button>
          <div id="mt5-pill" class="chip static"><span class="dot"></span><span>MT5 not checked</span></div>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>
  <div id="toasts" class="toasts"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
